<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background sheet gradient -->
    <linearGradient id="sheetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240a4e"/>
      <stop offset="60%" stop-color="#15062e"/>
      <stop offset="100%" stop-color="#0a0218"/>
    </linearGradient>

    <!-- Corner fold gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="50%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Pen body gradient -->
    <linearGradient id="penBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>

    <!-- Purple ambient glow filter for crisp visibility on all tab backgrounds -->
    <filter id="purpleGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#a855f7" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- PAPER SHEET -->
  <g filter="url(#purpleGlow)">
    <!-- Main Paper Body with folded top-right corner -->
    <path d="M 8 11
             C 8 7.5 10.5 5 14 5
             L 30 5
             L 42 17
             L 42 53
             C 42 56.5 39.5 59 36 59
             L 14 59
             C 10.5 59 8 56.5 8 53
             Z"
          fill="url(#sheetBg)"
          stroke="#c084fc"
          stroke-width="2.5"
          stroke-linejoin="round"/>

    <!-- Paper Corner Fold Flap -->
    <path d="M 30 5 L 30 17 L 42 17 Z"
          fill="url(#foldGrad)"
          stroke="#e879f9"
          stroke-width="2"
          stroke-linejoin="round"/>
  </g>

  <!-- Ruled Writing Lines on Paper -->
  <line x1="15" y1="23" x2="28" y2="23" stroke="#e879f9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="31" x2="35" y2="31" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="39" x2="32" y2="39" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="15" y1="47" x2="23" y2="47" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- PEN WRITING ON PAPER -->
  <!-- Transformed to position tip at (29, 47) angled up-right at 42 degrees -->
  <g transform="translate(29, 47) rotate(42)" filter="url(#purpleGlow)">
    <!-- Pen Barrel -->
    <rect x="-3.8" y="-38" width="7.6" height="22" rx="2" fill="url(#penBodyGrad)" stroke="#f5d0fe" stroke-width="1.2"/>

    <!-- Pen Clip -->
    <line x1="3.8" y1="-36" x2="3.8" y2="-22" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Pen Cap Top -->
    <rect x="-2.5" y="-41" width="5" height="3" rx="1" fill="#c084fc" stroke="#f5d0fe" stroke-width="0.8"/>

    <!-- Pen Collar / Metallic Ring -->
    <rect x="-4.2" y="-16" width="8.4" height="2.5" rx="0.6" fill="#fdf4ff" stroke="#a855f7" stroke-width="0.8"/>

    <!-- Pen Grip Section -->
    <polygon points="-3.5,-13.5 3.5,-13.5 3,-7.5 -3,-7.5" fill="#6b21a8" stroke="#c084fc" stroke-width="1"/>

    <!-- Pen Nib (Fountain / Stylus Tip) -->
    <polygon points="-3,-7.5 3,-7.5 0,0" fill="#fdf4ff" stroke="#e879f9" stroke-width="1" stroke-linejoin="round"/>

    <!-- Nib Ink Slit -->
    <line x1="0" y1="0" x2="0" y2="-5" stroke="#7e22ce" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Ink Mark at Pen Tip -->
  <circle cx="28.5" cy="47.5" r="1.8" fill="#f472b6" filter="url(#purpleGlow)"/>
</svg>
